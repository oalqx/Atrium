name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore Dependencies
      run: dotnet restore Atrium.slnx

    - name: Build Solution
      run: dotnet build Atrium.slnx -c Release --no-restore

    - name: Run Tests
      run: dotnet test Atrium.slnx -c Release --no-build --verbosity normal
